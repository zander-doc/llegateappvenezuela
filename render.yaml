# Despliegue en Render: un servicio para la API y otro para la web.
# La base de datos sigue en Neon; Render solo ejecuta el código.
#
# El monorepo vive en esta raíz, así que cada servicio apunta a su subdirectorio:
# la web se construye desde lllegate-sim y la API desde lllegate-sim/server.
# Cada uno instala con SU propio package-lock.json; si cambias un package.json
# sin regenerar su lockfile, `npm ci` de Render falla.
services:
  - type: web
    name: llegate-app-api
    runtime: node
    plan: free
    region: ohio
    rootDir: lllegate-sim/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "1"
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://llegate-app-web.onrender.com,https://llegate.app,https://www.llegate.app
      - key: PUBLIC_API_URL
        value: https://llegate-app-api.onrender.com
      # El OTP ya se entrega por WhatsApp, así que el código no debe quedar en
      # los logs. Si Meta falla, el log muestra el motivo ("[otp] fallo de
      # envío") sin registrar el código.
      - key: OTP_LOG_EN_DESARROLLO
        value: "0"
      - key: STORAGE_DRIVER
        value: local

  - type: web
    name: llegate-app-web
    runtime: static
    rootDir: lllegate-sim
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: llegate-app-api
          envVarKey: RENDER_EXTERNAL_URL
